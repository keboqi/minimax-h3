<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dubbing · Lip sync — Mobile</title>
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Source+Sans+3:wght@400;500;600;700&amp;display=swap">
  <style>
    body { margin: 0; }
    * { box-sizing: border-box; }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid #087f6c; outline-offset: 2px; }
  </style>
</helmet>
<div style="background: {{ t.bg }}; color: {{ t.text }}; font: 14px/1.4 'Source Sans 3', 'Source Sans Pro', system-ui, -apple-system, 'Segoe UI', sans-serif; display: flex; flex-direction: column; padding-bottom: 76px;">
  <!-- Compact Mobile Header -->
  <header style="position: sticky; top: 0; z-index: 20; background: {{ t.chrome }}; color: {{ t.chromeText }}; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; border-bottom: 1px solid {{ t.chromeLine }};">
    <div style="display: flex; align-items: center; gap: 8px; min-width: 0;">
      <strong style="font-size: 15px;">Lip sync</strong>
      <span style="font-size: 12px; color: {{ t.chromeMuted }}; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">The Editing Room</span>
    </div>
    <span style="font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: #1f3d35; color: #8ee6cf; white-space: nowrap;">9/10 takes</span>
  </header>

  <main style="padding: 12px; display: flex; flex-direction: column; gap: 12px;">
    <!-- Stage Card -->
    <section aria-label="Shot stage" style="background: {{ t.surface }}; border: 1px solid {{ t.line }}; border-radius: 12px; overflow: hidden;">
      <div style="padding: 8px 10px; border-bottom: 1px solid {{ t.lineSoft }}; display: flex; align-items: center; justify-content: space-between; gap: 6px;">
        <div role="group" aria-label="Stage view" style="display: inline-flex; padding: 2px; gap: 2px; border-radius: 8px; background: {{ t.lane }};">
          <button type="button" onClick="{{ setAlign }}" aria-pressed="{{ isAlign }}" style="min-height: 36px; padding: 0 10px; border: 0; border-radius: 6px; background: {{ alignBg }}; color: {{ alignFg }}; font-size: 13px; font-weight: 600;">Align</button>
          <button type="button" onClick="{{ setPreview }}" aria-pressed="{{ isPreview }}" style="min-height: 36px; padding: 0 10px; border: 0; border-radius: 6px; background: {{ previewBg }}; color: {{ previewFg }}; font-size: 13px; font-weight: 600;">Preview</button>
        </div>
        <span style="font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace; font-size: 11px; color: {{ t.muted }};">Shot 3 · 0:08.6</span>
      </div>

      <div style="position: relative; aspect-ratio: 16 / 9; background: #141c1a; overflow: hidden;">
        <img src="/_blob/91b03e7a5c1280205281051339fb81da" alt="Shot 3 mobile preview" style="display: block; width: 100%; height: 100%; object-fit: cover;">
        <div style="position: absolute; top: 8px; left: 8px; padding: 3px 8px; border-radius: 6px; background: rgba(10, 16, 14, 0.86); color: #8ee6cf; font-size: 11px; font-weight: 700;">{{ takeHud }}</div>
      </div>

      <!-- Horizontal Shot Takes Strip -->
      <div style="padding: 10px; display: flex; flex-direction: column; gap: 8px; background: {{ t.raised }}; border-top: 1px solid {{ t.lineSoft }};">
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <strong style="font-size: 13px;">Shot 3 takes</strong>
          <button type="button" onClick="{{ newTake }}" style="min-height: 36px; padding: 0 11px; border: 1px solid {{ t.accent }}; border-radius: 8px; background: {{ t.accent }}; color: {{ t.accentInk }}; font-size: 12px; font-weight: 700;">+ New take</button>
        </div>
        <div style="display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px;">
          <button type="button" onClick="{{ pickOrig }}" style="flex: 0 0 auto; min-height: 44px; padding: 6px 10px; border-radius: 8px; border: 1.5px solid {{ oBorder }}; background: {{ oBg }}; text-align: left;">
            <strong style="display: block; font-size: 12px;">Original</strong>
            <span style="font-size: 11px; color: {{ t.muted }};">No sync</span>
          </button>
          <button type="button" onClick="{{ pickT1 }}" style="flex: 0 0 auto; min-height: 44px; padding: 6px 10px; border-radius: 8px; border: 1.5px solid {{ t1Border }}; background: {{ t1Bg }}; text-align: left;">
            <strong style="display: block; font-size: 12px;">Take 1</strong>
            <span style="font-size: 11px; color: {{ t.muted }};">Face #2</span>
          </button>
          <button type="button" onClick="{{ pickT2 }}" style="flex: 0 0 auto; min-height: 44px; padding: 6px 10px; border-radius: 8px; border: 1.5px solid {{ t2Border }}; background: {{ t2Bg }}; text-align: left;">
            <strong style="display: block; font-size: 12px;">Take 2 ★</strong>
            <span style="font-size: 11px; color: {{ t.accentText }};">Face #1 · Updated</span>
          </button>
        </div>
      </div>
    </section>

    <!-- Compact Shots List -->
    <section aria-label="Shots list" style="background: {{ t.surface }}; border: 1px solid {{ t.line }}; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <h1 style="margin: 0; font-size: 15px; font-weight: 700;">Shots (12)</h1>
        <span style="font-size: 12px; color: {{ t.warn }}; font-weight: 700;">2 updated</span>
      </div>

      <sc-for list="{{ shots }}" as="sh" hint-placeholder-count="4">
        <div style="padding: 9px 10px; border-radius: 9px; border: 1px solid {{ sh.border }}; background: {{ sh.bg }}; display: flex; align-items: center; justify-content: space-between; gap: 8px;">
          <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
            <strong style="font-size: 13px;">Shot {{ sh.num }} · {{ sh.speaker }}</strong>
            <span style="font-size: 12px; color: {{ t.muted }};">{{ sh.desc }}</span>
          </div>
          <span style="font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: {{ sh.pillBg }}; color: {{ sh.pillFg }}; white-space: nowrap;">{{ sh.pill }}</span>
        </div>
      </sc-for>
    </section>
  </main>

  <!-- Sticky Bottom Incremental Assembly Bar -->
  <div style="position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 12px; background: {{ t.surface }}; border-top: 1px solid {{ t.line }}; display: flex; align-items: center; justify-content: space-between; gap: 10px; box-shadow: 0 -4px 14px rgba(10, 16, 14, 0.08);">
    <div style="display: flex; flex-direction: column;">
      <strong style="font-size: 13px;">2 shots updated</strong>
      <span style="font-size: 11px; color: {{ t.muted }};">~4 s fast splice</span>
    </div>
    <button type="button" onClick="{{ assembleNow }}" style="min-height: 44px; padding: 0 14px; border: 1px solid {{ t.accent }}; border-radius: 8px; background: {{ t.accent }}; color: {{ t.accentInk }}; font-size: 13px; font-weight: 700; white-space: nowrap;">Update full video</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'light';
    const isDark = theme === 'dark';
    const t = isDark ? {
      bg: '#111b18', surface: '#192522', raised: '#1e2c28', lane: '#22312c', line: '#34463e', lineSoft: '#2a3a34',
      text: '#e9f1ed', muted: '#a9bdb3', quiet: '#b8c7c0', quietBg: '#26342f',
      accent: '#66d8bb', accentInk: '#0b2a23', accentSoft: '#1f3d35', accentText: '#8ee6cf', selected: '#1c332d',
      warn: '#fdba74', warnBg: '#432010',
      chrome: '#0a100e', chromeLine: '#34463e', chromeText: '#e9f1ed', chromeMuted: '#a9bdb3'
    } : {
      bg: '#f2f5f3', surface: '#ffffff', raised: '#f7f9f8', lane: '#eef2f0', line: '#dbe3df', lineSoft: '#e8eeeb',
      text: '#202e2b', muted: '#4f605a', quiet: '#4b5a55', quietBg: '#eef2f0',
      accent: '#087f6c', accentInk: '#ffffff', accentSoft: '#e3f1ec', accentText: '#075b4e', selected: '#f2faf7',
      warn: '#8a420e', warnBg: '#fdecdc',
      chrome: '#141c1a', chromeLine: '#34463e', chromeText: '#e9f1ed', chromeMuted: '#a9bdb3'
    };

    const mode = this.state?.mode ?? 'preview';
    const take = this.state?.take ?? 't2';

    const shots = [
      { num: 3, speaker: 'Maya Lin', desc: 'Take 2 · Face #1 · H3', pill: 'Updated', pillBg: t.warnBg, pillFg: t.warn, bg: t.selected, border: t.accent },
      { num: 6, speaker: 'Maya Lin', desc: 'Face #1 · Not rendered', pill: 'Unrendered', pillBg: t.quietBg, pillFg: t.quiet, bg: t.raised, border: t.lineSoft },
      { num: 7, speaker: 'Carlos Vega', desc: 'Take 1 · LatentSync', pill: 'Updated', pillBg: t.warnBg, pillFg: t.warn, bg: t.raised, border: t.lineSoft },
      { num: 1, speaker: 'Maya Lin', desc: 'Take 1 · H3 · Reused', pill: 'In export', pillBg: t.accentSoft, pillFg: t.accentText, bg: t.raised, border: t.lineSoft }
    ];

    return {
      t, shots,
      isAlign: mode === 'align', isPreview: mode === 'preview',
      alignBg: mode === 'align' ? t.surface : 'transparent', alignFg: mode === 'align' ? t.text : t.muted,
      previewBg: mode === 'preview' ? t.surface : 'transparent', previewFg: mode === 'preview' ? t.text : t.muted,
      takeHud: take === 'orig' ? 'Original picture' : (take === 't1' ? 'Take 1 · Face #2' : 'Take 2 · Face #1 · Lip-synced'),
      oBorder: take === 'orig' ? t.accent : t.line, oBg: take === 'orig' ? t.selected : t.surface,
      t1Border: take === 't1' ? t.accent : t.line, t1Bg: take === 't1' ? t.selected : t.surface,
      t2Border: take === 't2' ? t.accent : t.line, t2Bg: take === 't2' ? t.selected : t.surface,
      setAlign: () => this.setState({ mode: 'align' }),
      setPreview: () => this.setState({ mode: 'preview' }),
      pickOrig: () => this.setState({ take: 'orig', mode: 'preview' }),
      pickT1: () => this.setState({ take: 't1', mode: 'preview' }),
      pickT2: () => this.setState({ take: 't2', mode: 'preview' }),
      newTake: () => this.setState({ take: 't2' }),
      assembleNow: () => this.setState({ mode: 'preview' })
    };
  }
}
</script>
</body>
</html>
