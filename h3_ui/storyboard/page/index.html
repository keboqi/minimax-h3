<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storyboard</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="editor" class="editor" hidden>
  <header class="topbar" id="topbar"></header>
  <div class="note" id="gpu-note" hidden>Scenes are generated on the GPU endpoint. Prepare every scene here, then open the GPU endpoint's Storyboard and press <strong>Generate all remaining scenes</strong>.</div>
  <section class="filmstrip" aria-label="Filmstrip">
    <div class="strip" id="strip"></div>
    <div class="strip-actions" id="strip-actions"></div>
    <div id="full-video"></div>
  </section>
  <div class="workarea">
    <main class="stage">
      <div class="stage-head" id="stage-head"></div>
      <div class="preview" id="preview"></div>
      <div id="stage-notes"></div>
      <div class="take-row" id="take-row"></div>
      <div id="take-confirm"></div>
    </main>
    <aside class="inspector" id="inspector"></aside>
  </div>
</div>
<div id="start" class="start" hidden></div>
<div id="loading" class="loading" role="status">Opening Storyboard…</div>
<div id="toast" class="toast" role="status" hidden></div>
<dialog id="library" class="library" aria-label="Media library"></dialog>
<input id="file-input" type="file" hidden>
<script src="app.js"></script>
</body>
</html>
